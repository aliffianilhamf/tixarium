version: '3.8'

services:
  # 1. Database Utama (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: tixarium_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: tixarium_db
    ports:
      - "5432:5432"
    volumes:
      - tixarium_pgdata:/var/lib/postgresql/data
    networks:
      - tixarium_network

# Definisi Volumes agar data tidak hilang saat container mati/restart
volumes:
  tixarium_pgdata:

# Definisi Network internal agar siap jika nanti Redis/layanan lain ditambahkan
networks:
  tixarium_network:
    driver: bridge